<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUBG Map Rotation</title><style>body{font:15px system-ui;margin:0;background:#101820;color:#edf2f7}main{max-width:1100px;margin:auto;padding:30px}section{background:#172431;border:1px solid #294052;border-radius:12px;padding:20px;margin:14px 0}label{display:block;color:#9bb0c0;margin:12px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;background:#0e1720;color:white;border:1px solid #385367;border-radius:6px;padding:10px}textarea{min-height:170px}button{background:#31c48d;border:0;border-radius:6px;padding:10px 16px;margin:10px 6px 0 0;font-weight:700;cursor:pointer}.secondary{background:#2e536b;color:white}.status{color:#9bb0c0;margin-left:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.week{background:#0f1a24;border-radius:8px;padding:12px;margin:8px 0;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🪂 PUBG Map Rotation</h1><p>Load a report, review the rotation, then publish it.</p><section><h2>Source report</h2><label>Report URL</label><input id="url"><button onclick="loadUrl()">Load report</button><label>Manual paste fallback</label><textarea id="paste"></textarea><button class="secondary" onclick="parsePaste()">Parse pasted tables</button><span class="status" id="status"></span></section><section><h2>Preview</h2><div id="preview">No report loaded.</div><button onclick="publish()">Update repository</button></section><section><h2>Persistent settings</h2><div class="grid"><div><label>GitHub username</label><input id="user"><label>Repository</label><input id="repo"><label>Branch</label><input id="branch"><label>Update day</label><select id="day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select></div><div><label>Update time (UTC)</label><input id="time" type="time"><label>Rollover Unix timestamp</label><input id="rollover" type="number"><label><input id="auto" type="checkbox" style="width:auto"> Automatic weekly updates</label><p>GitHub token and Discord webhooks are hidden from this UI and loaded from <code>/config/settings.yaml</code> or environment variables.</p><p id="secretStatus"></p></div></div><button class="secondary" onclick="saveSettings()">Save settings</button><button class="secondary" onclick="testDiscord()">Test Discord webhooks</button></section></main><script>let parsed=null;const $=id=>document.getElementById(id);async function api(url,opt){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}function show(p){parsed=p;$('preview').innerHTML=(p.weeks||[]).map(x=>`<div class="week"><b>Week ${x.week} (${x.date})</b>\nEU: ${(x.EU.length?x.EU:['Not used this season']).join(', ')}\nNA: ${(x.NA.length?x.NA:['Not used this season']).join(', ')}\nSEA: ${(x.SEA.length?x.SEA:['Not used this season']).join(', ')}</div>`).join('')}async function loadUrl(){try{$('status').textContent='Loading…';show(await api('/api/parse/url',{method:'POST',body:JSON.stringify({text:$('url').value})}));$('status').textContent='Loaded'}catch(e){$('status').textContent=e.message}}async function parsePaste(){try{show(await api('/api/parse/text',{method:'POST',body:JSON.stringify({text:$('paste').value})}));$('status').textContent='Parsed'}catch(e){$('status').textContent=e.message}}async function saveSettings(){try{await api('/api/settings',{method:'PUT',body:JSON.stringify({report_url:$('url').value,github_username:$('user').value,github_repo:$('repo').value,github_branch:$('branch').value,rollover_timestamp:Number($('rollover').value),schedule_weekday:Number($('day').value),schedule_time:$('time').value,automatic_updates:$('auto').checked})});$('status').textContent='Settings saved'}catch(e){$('status').textContent=e.message}}async function publish(){try{if(!parsed)throw Error('Load or paste a report first');let r=await api('/api/publish',{method:'POST',body:JSON.stringify({parsed})});$('status').textContent='Published: '+Object.keys(r.files).join(', ')}catch(e){$('status').textContent=e.message}}async function testDiscord(){try{await api('/api/discord/test',{method:'POST'});$('status').textContent='Discord test sent'}catch(e){$('status').textContent=e.message}}api('/api/settings').then(s=>{for(let [id,key] of [['url','report_url'],['user','github_username'],['repo','github_repo'],['branch','github_branch'],['rollover','rollover_timestamp'],['day','schedule_weekday'],['time','schedule_time']])$(id).value=s[key]??'';$('auto').checked=s.automatic_updates;$('secretStatus').textContent=`GitHub token: ${s.github_token_set?'configured':'missing'} · Discord webhooks: ${s.discord_webhooks_count||0}`}).catch(()=>{})</script></body></html>
