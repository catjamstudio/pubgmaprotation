<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUBG Map Rotation</title><style>body{font:15px system-ui;margin:0;background:#101820;color:#edf2f7}main{max-width:1100px;margin:auto;padding:30px}section{background:#172431;border:1px solid #294052;border-radius:12px;padding:20px;margin:14px 0}label{display:block;color:#9bb0c0;margin:10px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;background:#0e1720;color:white;border:1px solid #385367;border-radius:6px;padding:10px}textarea{min-height:170px}button{background:#31c48d;border:0;border-radius:6px;padding:10px 16px;margin:10px 6px 0 0;font-weight:700;cursor:pointer}.secondary{background:#2e536b;color:white}.danger{background:#8b3845;color:white}.status{color:#9bb0c0;margin-left:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.week{background:#0f1a24;border-radius:8px;padding:12px;margin:8px 0;white-space:pre-wrap}.hook{background:#0f1a24;border-radius:8px;padding:14px;margin:10px 0}.hook.compact{display:flex;align-items:center;justify-content:space-between;gap:12px}.hook-title{font-weight:700}.hook-url{color:#9bb0c0;font-size:12px;overflow:hidden;text-overflow:ellipsis}.hook img{width:42px;height:42px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:10px}.saved{color:#31c48d;margin-left:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🪂 PUBG Map Rotation</h1><p>Load a report, review the rotation, then publish it.</p><section><h2>Source report</h2><label>Report URL</label><input id="url"><button onclick="loadUrl()">Load report</button><label>Manual paste fallback</label><textarea id="paste"></textarea><button class="secondary" onclick="parsePaste()">Parse pasted tables</button><span class="status" id="status"></span></section><section><h2>Preview</h2><div id="preview">No report loaded.</div><button onclick="publish()">Update repository</button><span class="status" id="publishStatus"></span></section><section><h2>Settings</h2><div class="grid"><div><label>GitHub username</label><input id="user"><label>Repository</label><input id="repo"><label>Branch</label><input id="branch"><label>GitHub token</label><input id="token" type="password" autocomplete="new-password" placeholder="Leave blank to keep saved token"></div><div><label>Update day</label><select id="day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select><label>Update time (UTC)</label><input id="time" type="time"><label>Rollover Unix timestamp</label><input id="rollover" type="number"><label><input id="auto" type="checkbox" style="width:auto"> Automatic weekly updates</label></div></div><button class="secondary" onclick="saveSettings()">Save settings</button><span class="saved" id="settingsStatus"></span></section><section><h2>Discord webhooks</h2><p>Add as many destinations as needed. Save each row individually.</p><div id="hooks"></div><button class="secondary" onclick="addHook()">Add webhook</button><button class="secondary" onclick="testDiscord()">Test all webhooks</button></section></main><script>let parsed=null,webhooks=[];const $=id=>document.getElementById(id);async function api(url,opt){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}function renderHooks(){ $('hooks').innerHTML=webhooks.map((h,i)=>h.saved?`<div class="hook compact"><div>${h.avatar_url?`<img src="${h.avatar_url}">`:''}<span class="hook-title">${h.name||'Unnamed webhook'}</span><div class="hook-url">${h.username||''} · ${h.url||'No URL'}</div></div><button class="secondary" onclick="editHook(${i})">Edit</button></div>`:`<div class="hook"><div class="grid"><div><label>Name</label><input data-i="${i}" data-k="name" value="${h.name||''}"><label>Username</label><input data-i="${i}" data-k="username" value="${h.username||''}"><label>Webhook URL</label><input data-i="${i}" data-k="url" value="${h.url||''}"></div><div><label>Avatar URL</label><input data-i="${i}" data-k="avatar_url" value="${h.avatar_url||''}" oninput="previewAvatar(${i},this.value)"><img id="avatar-${i}" src="${h.avatar_url||''}" style="display:${h.avatar_url?'block':'none'}"><br><button class="secondary" onclick="saveHook(${i})">Save</button><button class="danger" onclick="webhooks.splice(${i},1);renderHooks()">Remove</button><span class="saved" id="hook-status-${i}"></span></div></div></div>`).join('');document.querySelectorAll('#hooks input').forEach(e=>e.onchange=()=>webhooks[e.dataset.i][e.dataset.k]=e.value)}function addHook(){webhooks.push({name:'',username:'',url:'',avatar_url:'',saved:false});renderHooks()}function editHook(i){webhooks[i].saved=false;renderHooks()}function saveHook(i){webhooks[i].saved=true;saveSettings().then(()=>{renderHooks();$('status').textContent='Webhook saved'}).catch(e=>$('status').textContent=e.message)}function previewAvatar(i,url){let e=$(`avatar-${i}`);e.src=url;e.style.display='block'}function show(p){parsed=p;$('preview').innerHTML=(p.weeks||[]).map(x=>`<div class="week"><b>Week ${x.week} (${x.date})</b>\nEU: ${(x.EU.length?x.EU:['Not used this season']).join(', ')}\nNA: ${(x.NA.length?x.NA:['Not used this season']).join(', ')}\nSEA: ${(x.SEA.length?x.SEA:['Not used this season']).join(', ')}</div>`).join('')}async function loadUrl(){try{$('status').textContent='Loading…';show(await api('/api/parse/url',{method:'POST',body:JSON.stringify({text:$('url').value})}));$('status').textContent='Loaded'}catch(e){$('status').textContent=e.message}}async function parsePaste(){try{show(await api('/api/parse/text',{method:'POST',body:JSON.stringify({text:$('paste').value})}));$('status').textContent='Parsed'}catch(e){$('status').textContent=e.message}}async function saveSettings(){try{await api('/api/settings',{method:'PUT',body:JSON.stringify({report_url:$('url').value,github_username:$('user').value,github_repo:$('repo').value,github_branch:$('branch').value,github_token:$('token').value,rollover_timestamp:Number($('rollover').value),schedule_weekday:Number($('day').value),schedule_time:$('time').value,automatic_updates:$('auto').checked,discord_webhooks:webhooks.map(({saved,...h})=>h)})});$('settingsStatus').textContent='Saved';setTimeout(()=>{$('settingsStatus').textContent=''},2500)}catch(e){$('settingsStatus').textContent=e.message;throw e}}async function publish(){try{if(!parsed)throw Error('Load or paste a report first');let r=await api('/api/publish',{method:'POST',body:JSON.stringify({parsed})});$('publishStatus').textContent='Updated';setTimeout(()=>{$('publishStatus').textContent=''},3000)}catch(e){$('publishStatus').textContent=e.message}}async function testDiscord(){try{await api('/api/discord/test',{method:'POST'});$('status').textContent='Discord test sent'}catch(e){$('status').textContent=e.message}}api('/api/settings').then(s=>{for(let [id,key] of [['url','report_url'],['user','github_username'],['repo','github_repo'],['branch','github_branch'],['rollover','rollover_timestamp'],['day','schedule_weekday'],['time','schedule_time']])$(id).value=s[key]??'';$('auto').checked=s.automatic_updates;webhooks=(s.discord_webhooks||[]).map(h=>({...h,saved:true}));renderHooks()}).catch(()=>{})</script></body></html>
