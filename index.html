<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUBG Map Rotation</title><style>body{font:15px system-ui;background:#101820;color:#edf2f7;margin:0;overflow-x:hidden}main{max-width:1100px;margin:auto;padding:20px}section,.hook{background:#172431;border:1px solid #294052;border-radius:12px;padding:16px;margin:14px 0;min-width:0}input,textarea,select{box-sizing:border-box;width:100%;background:#0e1720;color:white;border:1px solid #385367;border-radius:6px;padding:9px}textarea{min-height:130px}button{background:#31c48d;border:0;border-radius:6px;padding:10px 14px;margin:8px 5px 0 0;font-weight:bold}.secondary{background:#2e536b;color:#fff}.danger{background:#8b3845;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.week{background:#0f1a24;border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.hook{border:0;overflow:hidden}.compact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}.compact .info{min-width:0;overflow:hidden}.compact .url{font-size:12px;color:#9bb0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compact .edit{white-space:nowrap}img{width:42px;height:42px;border-radius:50%;object-fit:cover}@media(max-width:650px){main{padding:10px}section{padding:12px}.grid{grid-template-columns:1fr}.compact{grid-template-columns:auto minmax(0,1fr)}.compact .edit{grid-column:1;grid-row:1}.compact img{grid-column:2;grid-row:1}.compact .info{grid-column:2;grid-row:2}.compact .url{max-width:100%}}</style><main><h1>🪂 PUBG Map Rotation</h1><section><h2>Source report</h2><input id="url"><button onclick="load()">Load report</button><textarea id="paste" placeholder="Manual paste fallback"></textarea><button class="secondary" onclick="paste()">Parse pasted tables</button><span id="status"></span></section><section><h2>Preview</h2><div id="preview">No report loaded.</div><button onclick="publish()">Update repository</button><span id="publishStatus"></span></section><section><h2>Settings</h2><div class="grid"><div><label>GitHub username</label><input id="user"><label>Repository</label><input id="repo"><label>Branch</label><input id="branch"><label>GitHub token</label><input id="token" type="password" autocomplete="new-password"><small id="tokenState"></small></div><div><label>Update day</label><select id="day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select><label>Update time UTC</label><input id="time" type="time"><label>Rollover timestamp</label><input id="rollover" type="number"><label><input id="auto" type="checkbox" style="width:auto"> Automatic updates</label></div></div><button class="secondary" onclick="save()">Save settings</button><span id="saveStatus"></span></section><section><h2>Discord webhooks</h2><div id="hooks"></div><button class="secondary" onclick="add()">Add webhook</button><button class="secondary" onclick="test()">Test all webhooks</button></section></main><script>let p=null,hooks=[];const $=x=>document.getElementById(x);async function api(u,o){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}function draw(){hooks.forEach((h,i)=>h.saved=h.saved??true);$('hooks').innerHTML=hooks.map((h,i)=>h.saved?`<div class="hook compact"><button class="secondary edit" onclick="edit(${i})">Edit</button>${h.avatar_url?`<img src="${h.avatar_url}">`:''}<div class="info"><b>${h.name||'Unnamed webhook'}</b><div>${h.username||''}</div><div class="url">${h.url||'No URL'}</div></div></div>`:`<div class="hook"><div class="grid"><div><label>Name</label><input data-i="${i}" data-k="name" value="${h.name||''}"><label>Username</label><input data-i="${i}" data-k="username" value="${h.username||''}"><label>Webhook URL</label><input data-i="${i}" data-k="url" value="${h.url||''}"></div><div><label>Avatar URL</label><input data-i="${i}" data-k="avatar_url" value="${h.avatar_url||''}"><button onclick="saveHook(${i})">Save</button><button class="danger" onclick="hooks.splice(${i},1);draw()">Remove</button><span id="hs${i}"></span></div></div></div>`).join('');document.querySelectorAll('#hooks input').forEach(e=>e.onchange=()=>hooks[e.dataset.i][e.dataset.k]=e.value)}function add(){hooks.push({name:'',username:'',url:'',avatar_url:'',saved:false});draw()}function edit(i){hooks[i].saved=false;draw()}async function saveHook(i){try{await save();hooks[i].saved=true;draw();$('status').textContent='Saved'}catch(e){$('status').textContent=e.message}}function show(x){p=x;$('preview').innerHTML=(x.weeks||[]).map(w=>`<div class="week"><b>Week ${w.week} (${w.date})</b>\nEU: ${(w.EU.length?w.EU:['Not used this season']).join(', ')}\nNA: ${(w.NA.length?w.NA:['Not used this season']).join(', ')}\nSEA: ${(w.SEA.length?w.SEA:['Not used this season']).join(', ')}</div>`).join('')}async function load(){try{show(await api('/api/parse/url',{method:'POST',body:JSON.stringify({text:$('url').value})}));$('status').textContent='Loaded'}catch(e){$('status').textContent=e.message}}async function paste(){try{show(await api('/api/parse/text',{method:'POST',body:JSON.stringify({text:$('paste').value})}));$('status').textContent='Parsed'}catch(e){$('status').textContent=e.message}}async function save(){let t=$('token').value;try{await api('/api/settings',{method:'PUT',body:JSON.stringify({report_url:$('url').value,github_username:$('user').value,github_repo:$('repo').value,github_branch:$('branch').value,github_token:t==='••••••••'?'':t,rollover_timestamp:+$('rollover').value,schedule_weekday:+$('day').value,schedule_time:$('time').value,automatic_updates:$('auto').checked,discord_webhooks:hooks.map(({saved,...x})=>x)})});$('saveStatus').textContent='Saved';setTimeout(()=>$('saveStatus').textContent='',2500);return true}catch(e){$('saveStatus').textContent=e.message;throw e}}async function publish(){try{if(!p)throw Error('Load a report first');await api('/api/publish',{method:'POST',body:JSON.stringify({parsed:p})});$('publishStatus').textContent='Updated'}catch(e){$('publishStatus').textContent=e.message}}async function test(){try{await api('/api/discord/test',{method:'POST'});$('status').textContent='Discord test sent'}catch(e){$('status').textContent=e.message}}api('/api/settings').then(s=>{$('url').value=s.report_url;$('user').value=s.github_username;$('repo').value=s.github_repo;$('branch').value=s.github_branch;$('rollover').value=s.rollover_timestamp;$('day').value=s.schedule_weekday;$('time').value=s.schedule_time;$('auto').checked=s.automatic_updates;if(s.github_token_set){$('token').value='••••••••';$('tokenState').textContent='Token saved';}hooks=s.discord_webhooks||[];draw()})</script>
